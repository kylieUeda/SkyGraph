<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SkyGraph</title>

    <!-- Style and JavaScript for Leaflet * still needs to be displayed * -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>
<body>
    <!-- Header -->
    <header style="height: 48px; display: flex; padding: 5%; background: #02636D; font-size: calc(1rem + 5vw); color: #ffffff; font-family: Optima;">
        <span>SKYGRAPH</span>

        <div style="position: relative;">
            <!--
                type="file" : Open the dialog for the file selection
                accept="image/*" : Only image files can be selected
            -->
            <input
                type="file"
                id="fileInput" 
                accept="image/*"
                style="position: absolute; inset: 0; opacity: 0; cursor: pointer;"
            />

            <label for="fileInput" style="
                font-size: 0.75rem;
                cursor: pointer;
            ">
            Upload Boarding Pass
            </label>
        </div>
    </header>

    <!-- Get a space to draw a map -->
    <div id="map" style="width: 100%; height:calc(100vh - 48px);"></div>

    <script>
        //////////////////////// MAP ////////////////////////
        // Initialize a map with JS by targetting the div created on step 1 - L.map: draw a map
        const map = L.map('map', {
            center: [20,0], // Set the centre of the map
            zoom: 2 // 1 - 18?
        });

        // load tile images and put them in the map - .tilelayer: loading tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO', // Get a map image from the server of CartoDB
        }).addTo(map)

        //////////////////////// CONNECT TO API ////////////////////////
        // Get fileInput
        const fileInput = document.getElementById('fileInput');

        // Event occuring when the file is chosen
        fileInput.addEventListener('change', async (e) => {
            // get a file selected
            const file = e.target.files[0];
            if (!file) return; // when cancelled

            // FormData -> a placeholder to send the file with the HTTP request
            const formData = new FormData();
            formData.append('file', file);

            // send a POST request to FastAPI
            const response = await fetch("http://localhost:8000/extract", { // await = wait for response
                method: "POST",
                body: formData,
            })

            // Get the response as JSON
            const data = await response.json();

            // test
            console.log(data);

        //////////////////// Draw flights ////////////////////
            const dep = data.departure;
            const dest = data.destination;

            // Mark the departure point
            L.marker([dep.lat, dep.lon]).addTo(map)

            // Mark the destination point
            L.marker([dest.lat, dest.lon]).addTo(map)

            // draw the line inbetween
            L.polyline([
                [dep.lat, dep.lon],
                [dest.lat, dest.lon]
            ], {
                color : "#D6C8C3",
                weight : 5,
            }).addTo(map);
        })
    </script>

</body>
</html>
