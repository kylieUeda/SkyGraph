<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SkyGraph</title>

    <!-- Style and JavaScript for Leaflet * still needs to be displayed * -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>
<body>
    <!-- Header -->
    <header style="
        height: 100px;
        width: 100%;
        position: fixed;
        z-index: 1000;
        top: 0;
        display: flex;
        padding: 0 5%;
        justify-content: space-between;
        background: #02636D;
        font-size: clamp(2rem, 5vw, 5rem);
        color: #ffffff;
        font-family: Optima;
        text-align: justify;
        align-items: center;">

        <span>SKYGRAPH</span>

        <label id='addFlightBtn' style="
            font-size: 1rem;
            cursor: pointer;
            color: white;
            text-decoration: underline;
            padding-right: 10%;
        ">
            + Add New Flight
        </label>
        <input
                type="file"
                id="fileInput"
                accept="image/*"
                style="display: none;"
            />
    </header>

    <!-- Get a space to draw a map -->
    <div id="map" style="width: 100%; height:calc(100vh - 48px); top: 100px;"></div>

    <!--
    z-index: layer (usually 400, but 1000 this time to bring it to the front)
    align-items: vertical
    justify-content: horizontal
    -->
    <div id="uploadModal" style="
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        align-items: center;
        justify-content: center;">

        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center; color: #333;">
            <h3>Select Input Method</h3>
            <button onclick="document.getElementById('fileInput').click(); closeModal();">Upload Image</button>
            <button onclick="openManualInput();">Manual Entry</button>
            <button onclick="closeModal();">Cancel</button>
        </div>
    </div>

    <script>
        // // test
        // console.log('script loaded!');
        // console.log('fileInput:', document.getElementById('fileInput'));

        //////////////////////// MAP ////////////////////////
        // Initialize a map with JS by targetting the div created on step 1 - L.map: draw a map
        const map = L.map('map', {
            center: [0,0], // Set the centre of the map
            zoom: 2, // 1 - 18?
            minZoom: 2,
            maxZom: 10,
            maxBounds: [[-90, -180], [90, 180]],
            maxBoundsViscosity: 1.0,
            worldCopyJump: false // unable to duplicate the map
        });

        // load tile images and put them in the map - .tilelayer: loading tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO', // Get a map image from the server of CartoDB
        }).addTo(map)

        //////////////////////// CONNECT TO API ////////////////////////
        // Get fileInput
        const fileInput = document.getElementById('fileInput');

        // test
        // console.log('adding event listener...');

        // Event occuring when the file is chosen
        fileInput.addEventListener('change', async (e) => {
            e.preventDefault(); // prevent the page reloading after uploading

            // get a file selected
            const file = e.target.files[0];
            if (!file) return; // when cancelled

            // FormData -> a placeholder to send the file with the HTTP request
            const formData = new FormData();
            formData.append('file', file);

            // send a POST request to FastAPI
            const response = await fetch("http://localhost:8000/extract", { // await = wait for response
                method: "POST",
                body: formData,
            })

            // Get the response as JSON
            const data = await response.json();

            // // test
            // console.log(data);

        //////////////////// Draw flights ////////////////////
            const dep = data.departure;
            const dest = data.destination;

            // var myIcon = L.icon({ iconSize: [38, 95], // Width and Height in pixels

            // Mark departure point
            // L.marker([dep.latitude, dep.longitude], { iconSize: [10, 10]}).addTo(map)
            L.marker([dep.latitude, dep.longitude]).addTo(map)

            // Mark destination point
            L.marker([dest.latitude, dest.longitude]).addTo(map)

            // draw the line inbetween
            L.polyline([
                [dep.latitude, dep.longitude],
                [dest.latitude, dest.longitude]
            ], {
                color : "#D6C8C3",
                weight: 2
            }).addTo(map);

        });

        const modal = document.getElementById('uploadModal');
        const addFlightBtn = document.getElementById('addFlightBtn');

        function openModal() {
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        if (addFlightBtn) {
            addFlightBtn.onclick = openModal;
            // addFlightBtn.onclick = openModal(); -> modal shows up when refresh the page
        }

        // for manual input
        function openManualInput() {
            alert("Manual input form will be here!"); // check if it works
            closeModal();
        }

    </script>
    
</body>
</html>
